<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Design Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #edeae3;
    --paper-raised: #f7f5f0;
    --ink: #201e1b;
    --ink-soft: #55524b;
    --graphite: #6b6862;
    --line: #d3cfc5;
    --registration: #c1432e;
    --shadow: rgba(32, 30, 27, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 32px 96px;
  }

  /* ---- Header ---- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--ink);
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--registration);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 5vw, 52px);
    line-height: 1.02;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .count-block {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.6;
  }

  .count-block strong {
    display: block;
    font-size: 28px;
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
  }

  /* ---- Dropzone with registration marks ---- */
  .dropzone {
    position: relative;
    border: 1px solid var(--ink);
    background: var(--paper-raised);
    padding: 40px 32px;
    margin-bottom: 56px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .dropzone.drag-over {
    background: #fff;
    border-color: var(--registration);
  }

  .reg-mark {
    position: absolute;
    width: 16px;
    height: 16px;
    pointer-events: none;
  }
  .reg-mark::before, .reg-mark::after {
    content: "";
    position: absolute;
    background: var(--ink);
  }
  .reg-mark::before { width: 100%; height: 1px; top: 50%; left: 0; }
  .reg-mark::after { width: 1px; height: 100%; left: 50%; top: 0; }
  .reg-tl { top: -8px; left: -8px; }
  .reg-tr { top: -8px; right: -8px; }
  .reg-bl { bottom: -8px; left: -8px; }
  .reg-br { bottom: -8px; right: -8px; }

  .dropzone-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 6px;
  }

  .dropzone-sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }

  .dropzone-sub .hl {
    color: var(--registration);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  #file-input { display: none; }

  /* ---- Gallery ---- */
  .gallery {
    columns: 3 280px;
    column-gap: 24px;
  }

  @media (max-width: 700px) {
    .gallery { columns: 1 280px; }
  }

  .piece {
    break-inside: avoid;
    margin-bottom: 24px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.45s ease forwards;
    position: relative;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .piece img {
    display: block;
    width: 100%;
    height: auto;
    border-bottom: 1px solid var(--line);
    cursor: zoom-in;
  }

  .piece:hover {
    box-shadow: 0 6px 18px var(--shadow);
  }

  .placard {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: baseline;
    gap: 4px 10px;
    padding: 10px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .placard .no {
    color: var(--registration);
    font-weight: 500;
  }

  .placard .title {
    grid-column: 1 / -1;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .remove-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    background: rgba(32,30,27,0.72);
    color: #fff;
    border: none;
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .piece:hover .remove-btn { opacity: 1; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  /* ---- Lightbox ---- */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(32,30,27,0.92);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 40px;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .lightbox-caption {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #eee;
  }

  footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <div>
      <p class="eyebrow">Design Archive — Vol. 01</p>
      <h1>Catalog of Work</h1>
    </div>
    <div class="count-block">
      <strong id="piece-count">000</strong>
      pieces on record
    </div>
  </header>

  <div class="dropzone" id="dropzone">
    <div class="reg-mark reg-tl"></div>
    <div class="reg-mark reg-tr"></div>
    <div class="reg-mark reg-bl"></div>
    <div class="reg-mark reg-br"></div>
    <p class="dropzone-title">Drop designs here</p>
    <p class="dropzone-sub">or <span class="hl">browse your files</span> — JPG, PNG, WEBP, GIF, SVG</p>
    <input type="file" id="file-input" accept="image/*" multiple>
  </div>

  <div class="gallery" id="gallery">
    <div class="empty-state" id="empty-state">No pieces catalogued yet. Add your first design above.</div>
  </div>

  <footer>In-memory archive — pieces stay for this session only. Refreshing clears the catalog.</footer>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const gallery = document.getElementById('gallery');
  const emptyState = document.getElementById('empty-state');
  const pieceCount = document.getElementById('piece-count');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCaption = document.getElementById('lightbox-caption');

  let pieces = [];
  let counter = 0;

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function formatDate(d) {
    return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
  }

  function updateCount() {
    pieceCount.textContent = String(pieces.length).padStart(3, '0');
    emptyState.style.display = pieces.length ? 'none' : 'block';
  }

  function renderPiece(piece) {
    const el = document.createElement('div');
    el.className = 'piece';
    el.dataset.id = piece.id;

    const img = document.createElement('img');
    img.src = piece.dataUrl;
    img.alt = piece.name;
    img.addEventListener('click', () => openLightbox(piece));
    el.appendChild(img);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '✕';
    removeBtn.title = 'Remove from catalog';
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      pieces = pieces.filter(p => p.id !== piece.id);
      el.remove();
      updateCount();
    });
    el.appendChild(removeBtn);

    const placard = document.createElement('div');
    placard.className = 'placard';
    placard.innerHTML = `
      <div class="title">${piece.name}</div>
      <span class="no">No. ${piece.catNo}</span>
      <span>${piece.dims}</span>
      <span>${piece.size}</span>
    `;
    el.appendChild(placard);

    gallery.appendChild(el);
  }

  function openLightbox(piece) {
    lightboxImg.src = piece.dataUrl;
    lightboxCaption.textContent = `No. ${piece.catNo} — ${piece.name} — ${piece.dims} — ${formatDate(piece.date)}`;
    lightbox.classList.add('open');
  }

  lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

  function handleFiles(fileList) {
    [...fileList].forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        const imgProbe = new Image();
        imgProbe.onload = () => {
          counter += 1;
          const piece = {
            id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
            name: file.name.replace(/\.[^/.]+$/, ''),
            dataUrl,
            dims: `${imgProbe.naturalWidth}×${imgProbe.naturalHeight}px`,
            size: formatBytes(file.size),
            date: new Date(),
            catNo: String(counter).padStart(3, '0')
          };
          pieces.push(piece);
          renderPiece(piece);
          updateCount();
        };
        imgProbe.src = dataUrl;
      };
      reader.readAsDataURL(file);
    });
  }

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('drag-over');
    })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
    })
  );
  dropzone.addEventListener('drop', (e) => {
    handleFiles(e.dataTransfer.files);
  });

  updateCount();
</script>

</body>
</html>
